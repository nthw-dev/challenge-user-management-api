version: v2
managed:
  enabled: false
plugins:
  # Use the plugins from this machine (installed with go install), so generation works with no network.
  - local: protoc-gen-go
    out: internal/adapter/inbound/grpc/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/adapter/inbound/grpc/gen
    opt: paths=source_relative,require_unimplemented_servers=true
