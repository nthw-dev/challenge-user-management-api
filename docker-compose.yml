services:
  mongo:
    # Pinned to the 8.0 line on purpose: the floating `mongo:8` tag already points at 8.3, which refuses to open a data
    # volume written by 7.x (exit 62, "Wrong mongod version"). 8.0 opens it and upgrades in place. Moving past 8.0 later
    # means either `make down` (wipes the volume) or setFeatureCompatibilityVersion first.
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: userdb
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017" # exposed so it can be reached with Compass during review
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      args:
        VERSION: local
        GO_TAGS: dev # brings /grpcui up alongside the API, as make run does
    restart: unless-stopped
    depends_on:
      mongo:
        # ★ Wait until MongoDB really accepts commands, not merely until the container has started.
        # depends_on on its own makes the API die on every first run.
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_LEVEL: "info"
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "userdb"
      MONGO_REFRESH_COLLECTION: "refresh_tokens"
      MONGO_CONN_TIMEOUT: "1m"
      MONGO_MAX_CONN_IDLE_TIME: "30m"
      MONGO_MAX_IDLE_CONNS: "10"
      MONGO_MAX_OPEN_CONNS: "10"
      # A development value, so `make up` needs no setup — export JWT_SECRET in the shell (or put it in .env) to override.
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes}"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "168h"
      BCRYPT_COST: "12"
      USER_COUNT_INTERVAL: "10s"
      SHUTDOWN_TIMEOUT: "15s"
      SHUTDOWN_DELAY: "2s"
      SERVER_READ_HEADER_TIMEOUT: "5s"
      SERVER_READ_TIMEOUT: "5s"
      SERVER_WRITE_TIMEOUT: "10s"
      SERVER_IDLE_TIMEOUT: "0"
      SERVER_RPC_TIMEOUT: "10s"
    ports:
      - "8080:8080"
      - "9090:9090"

  mongoku:
    image: huggingface/mongoku:2.11.2 # pinned; :latest moved under our feet once already
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGOKU_DEFAULT_HOST: "mongodb://mongo:27017"
    ports:
      - "3100:3100" # http://localhost:3100

volumes:
  mongo-data:
